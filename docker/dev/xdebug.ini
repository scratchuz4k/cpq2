; Only start a debug session when asked to: browser extension / ?XDEBUG_TRIGGER=1
; for web requests, `sail debug <command>` for artisan commands.
; Don't set SAIL_XDEBUG_CONFIG in .env: Xdebug treats the XDEBUG_CONFIG env var
; itself as a trigger, which makes every CLI process (Horizon, artisan, php -S) connect.
xdebug.start_with_request=trigger
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
