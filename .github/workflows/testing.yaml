name: Testing

on: [push, pull_request]

jobs:
  run-backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: json, dom, libxml, mbstring,  bcmath, curl, sqlite3, fileinfo, pcntl, redis, bcmath, gd, zip
          coverage: none
      - name: Setup NodeJS
        uses: actions/setup-node@v4

      - name: Copy .env
        run: cp .env.testing .env
      - name: Create Database
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE cypress character set UTF8mb4 collate utf8mb4_bin;"
          mysql --user="root" --password="root" -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'";
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist

      - name: Prepare Laravel env and db
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed

      - name: Install Node Dependencies
        run: |
          npm install
          npm run build

      - name: Run Laravel Server
        run: php artisan serve --port=8000 > /dev/null 2>&1 &

      - name: Check laravel local server
        run: curl http://localhost:8000/health

      - name: Execute tests
        run: npm run cy:run
      # - name: Upload Cypress screenshots
