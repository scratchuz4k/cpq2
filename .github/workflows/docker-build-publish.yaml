name: Docker Build & Publish

on:
  push:
    branches: ["*"]
    tags: ["*.*.*"]
  pull_request:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Build & Publish Docker Image
    runs-on: ubuntu-24.04
    environment: staging

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3.10
          extensions: mbstring, bcmath, curl, sqlite3, fileinfo, pcntl, redis, bcmath, gd, zip

      - name: Install Dependencies
        run: composer install

      - name: Install NPM Packages
        run: |
          npm install
          npm run build

      - name: Install Nginx and PHP-FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx php-fpm php-mysql php-sqlite3
          sudo systemctl start php8.3-fpm

      - name: Configure Nginx
        run: |
          # Create Nginx server block for Laravel
          sudo bash -c 'cat > /etc/nginx/sites-available/laravel <<EOF
          server {
              listen 8000;
              server_name localhost;
              root $GITHUB_WORKSPACE/public;

              index index.php index.html;

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location ~ \.php\$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                  include fastcgi_params;
              }

              location ~ /\.ht {
                  deny all;
              }
          }
          EOF'

          # Enable the server block and restart Nginx
          sudo ln -s /etc/nginx/sites-available/laravel /etc/nginx/sites-enabled/
          sudo rm /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Start Laravel Server
        run: |
          cat /etc/nginx/sites-available/laravel
          echo "Application running at: http://localhost"
          sleep 5 # Allow Nginx to start fully

      # Create SQLite database file
      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Prepare Laravel Application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed

      - name: Run laravel tests
        run: php artisan test

      - name: Check if Laravel App is Running
        run: curl -I http://localhost:8000/health

      - name: Show Laravel Logs
        run: |
          echo "Laravel Log File:"
          cat storage/logs/laravel.log || echo "No log file found"

      - name: Run Cypress Tests
        run: npx cypress run

