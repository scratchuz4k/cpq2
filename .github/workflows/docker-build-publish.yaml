name: Docker Build & Publish

on: [push, pull_request]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_WORKSPACE: ${{ github.workspace }}

jobs:
  tests:
    name: Build & Publish Docker Image
    runs-on: ubuntu-24.04
    environment: staging

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: json, dom, libxml, mbstring, bcmath, curl, sqlite3, fileinfo, pcntl, redis, bcmath, gd, zip
          coverage: none
      - name: Setup NodeJS
        uses: actions/setup-node@v4

      - name: Copy .env
        run: cp .env.testing .env
      - name: Create Database
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE cypress character set UTF8mb4 collate utf8mb4_bin;"
          mysql --user="root" --password="root" -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'";
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-suggest --no-progress --prefer-dist

      - name: Prepare Laravel env and db
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed
          php artisan db:seed CategoryProductsSeeder

      - name: Install Node Dependencies
        run: |
          npm install
          npm run build

      - name: Run Laravel Server
        run: php artisan serve --host=0.0.0.0 --port=8000 &

      - name: Check laravel local server
        run: curl http://localhost:8000/health

      - name: Execute tests
        run: npm run cy:run

      - name: Check for failed Cypress tests and send screenshot to Discord
        if: failure()
        run: |
          # Zip the screenshot file
          zip -r screenshot.zip cypress/screenshots/*
          COMMIT_OWNER="${GITHUB_ACTOR}"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"

          # Send the screenshot to Discord
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@screenshot.zip" \
            -F "payload_json={\"content\": \"@$COMMIT_OWNER: Cypress test failed on branch $BRANCH_NAME ($REPO_OWNER)! Here are the screenshots:\"}"
        env:
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/1308426382472384655/mCq2fiiN5ydJenImCL0Y4AqCnIXZ2dudOpEPUWxP3GqXBRDa3lpDOTTDCzfffDuKuuUr


