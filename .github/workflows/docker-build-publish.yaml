name: Docker Build & Publish

on:
  push:
    branches: ["*"]
    tags: ["*.*.*"]
  pull_request:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  tests:
    name: Build & Publish Docker Image
    runs-on: ubuntu-24.04
    environment: staging

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Composer
        uses: php-actions/composer@v6
        with:
          php_version: 8.3.10
          php_extensions: pcntl redis bcmath gd zip
          version: latest

      - name: Run laravel tests
        run: php artisan test

