name: Run Cypress Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Start Laravel Server
        run: |
          cp .env.example .env
          composer install
          php artisan key:generate
          php artisan serve &

      - name: Run Cypress tests
        run: npx cypress run
