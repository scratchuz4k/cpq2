name: Check Code Format

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    formatting:
        name: Check Code Format
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'

            - name: Install JS dependencies
              run: npm ci

            - name: Install PHP dependencies
              run: composer install --no-progress --prefer-dist --no-scripts

            - name: Run Format check
              id: format_error
              shell: bash
              run: |
                  set +e  # Don't exit on error

                  echo "▶ Running Prettier check..."
                  PRETTIER_OUTPUT=$(npx prettier --check "**/*.{js,vue,css,scss}" 2>&1)
                  PRETTIER_EXIT_CODE=$?

                  echo "$PRETTIER_OUTPUT"
                  echo "🔍 Parsing Prettier result..."

                  # Clean output and extract files from Prettier
                  CLEANED_PRETTIER_OUTPUT=$(echo "$PRETTIER_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g')
                  PRETTIER_FILES=$(echo "$CLEANED_PRETTIER_OUTPUT" | grep -E '^[^ ]+\.(js|vue|css|scss)' | awk '{print $1}' || true)

                  echo ""
                  echo "▶ Running Laravel Pint check..."
                  PINT_OUTPUT=$(vendor/bin/pint --test 2>&1)
                  PINT_EXIT_CODE=$?

                  echo "$PINT_OUTPUT"
                  echo "🔍 Parsing Pint result..."

                  # Extract file paths from Pint output
                  PINT_FILES=$(echo "$PINT_OUTPUT" | grep -Eo '⨯ [^ ]+\.php' | awk '{print $2}' || true)

                  # Write results to error_files.txt
                  {
                    if [ "$PRETTIER_EXIT_CODE" -ne 0 ]; then
                      echo "❌ Prettier found issues in:"
                      if [ -n "$PRETTIER_FILES" ]; then
                        echo "$PRETTIER_FILES"
                      else
                        echo "(Could not parse file list. Raw output below:)"
                        echo "$CLEANED_PRETTIER_OUTPUT"
                      fi
                      echo ""
                    fi

                    if [ "$PINT_EXIT_CODE" -ne 0 ]; then
                      echo "❌ Pint found issues in:"
                      if [ -n "$PINT_FILES" ]; then
                        echo "$PINT_FILES"
                      else
                        echo "(Could not parse file list. Raw output below:)"
                        echo "$PINT_OUTPUT"
                      fi
                    fi
                  } > error_files.txt

                  echo ""
                  echo "🔍 Contents of error_files.txt:"
                  cat error_files.txt

                  if [ "$PRETTIER_EXIT_CODE" -ne 0 ] || [ "$PINT_EXIT_CODE" -ne 0 ]; then
                    echo ""
                    echo "❗ Code formatting issues detected."
                    exit 1
                  else
                    echo "✅ All files are properly formatted."
                  fi

            - name: Check for files and send list to Discord
              if: failure()
              run: |
                  # Zip the screenshot file
                  COMMIT_OWNER="${GITHUB_ACTOR}"
                  BRANCH_NAME="${GITHUB_REF#refs/heads/}"
                  REPO_OWNER="${GITHUB_REPOSITORY%/*}"
                  # Define the target username
                  TARGET_USER="$COMMIT_OWNER"
                  # Get the user ID from the array using the target username
                  USER_ID="${{ secrets.ID_DISCORD_CRIS }}"
                  # Check if the user ID exists
                  if [ -z "$USER_ID" ]; then
                    echo "User $TARGET_USER not found!"
                    exit 1
                  fi
                  # Send the screenshot to Discord
                  curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
                    -H "Content-Type: multipart/form-data" \
                    -F "file=@error_files.txt" \
                    -F "payload_json={\"content\": \"<@$USER_ID> Tests failed on commit:  ${GITHUB_EVENT_HEAD_COMMIT_MESSAGE} ($BRANCH_NAME @ $REPO_OWNER)! Here is the list of files:\"}"
